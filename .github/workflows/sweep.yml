name: Sweep
run-name: "Sweep ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Manifest release tag
        required: true
        type: string
      sha256:
        description: Manifest SHA256
        required: true
        type: string
      allow_fetch:
        description: Fetch missing files
        required: true
        default: false
        type: boolean
      parallel:
        description: Maximum active jobs
        default: 20
        type: number
      rpm:
        description: Combined origin request ceiling
        default: 360
        type: number
      lanes:
        description: Transfers per job
        default: 1
        type: number

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag }}
  PLAN_SHA: ${{ inputs.sha256 }}
  PARALLEL: ${{ inputs.parallel }}
  RPM: ${{ inputs.rpm }}
  LANES: ${{ inputs.lanes }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      parallel: ${{ steps.queue.outputs.parallel }}
      count: ${{ steps.queue.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python -B -m unittest -v test_sweep
      - name: Read list
        run: python -B sweep.py retrieve --manifest input/manifest.json --sha256 "$PLAN_SHA" --repo "$REPO" --tag "$TAG" --out out
      - name: Queue
        id: queue
        run: python -B sweep.py prepare --manifest input/manifest.json --sha256 "$PLAN_SHA" --repo "$REPO" --tag "$TAG" --out out --parallel "$PARALLEL" --rpm "$RPM" --lanes "$LANES"

  collect:
    needs: prepare
    if: ${{ inputs.allow_fetch && needs.prepare.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read list
        run: python -B sweep.py retrieve --manifest input/manifest.json --sha256 "$PLAN_SHA" --repo "$REPO" --tag "$TAG" --out out
      - name: Fill boxes
        env:
          CHUNK: ${{ matrix.shard }}
        run: python -B sweep.py fetch --manifest input/manifest.json --sha256 "$PLAN_SHA" --repo "$REPO" --tag "$TAG" --shard "$CHUNK" --out out --parallel "$PARALLEL" --rpm "$RPM" --lanes "$LANES"

  summary:
    needs: [prepare, collect]
    if: ${{ always() && needs.prepare.result == 'success' && (inputs.allow_fetch || needs.prepare.outputs.count == '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read list
        run: python -B sweep.py retrieve --manifest input/manifest.json --sha256 "$PLAN_SHA" --repo "$REPO" --tag "$TAG" --out out
      - name: Count boxes
        run: python -B sweep.py aggregate --manifest input/manifest.json --sha256 "$PLAN_SHA" --repo "$REPO" --tag "$TAG" --out out
