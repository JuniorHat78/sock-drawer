name: Probe
run-name: Probe ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Sealed experiment release
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check cryptography==42.0.8
      - name: Check sealed experiment
        env:
          GH_TOKEN: ${{ github.token }}
          BOX_KEY: ${{ secrets.BOX_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: python -B mill.py probe --repo "$REPO" --tag "$TAG" --out out
