name: Probe
run-name: Probe ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Sealed experiment release
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: probe
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Prepare workspace
        timeout-minutes: 8
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess
          workspace = os.environ['RUNNER_TEMP']
          before = shutil.disk_usage(workspace).free
          attempted = 0
          if os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted' and before < 32 * 1024**3:
              for directory in ('/usr/local/lib/android', '/usr/share/dotnet', '/opt/ghc'):
                  if not os.path.isdir(directory): continue
                  attempted += 1
                  try:
                      subprocess.run(['sudo', 'rm', '-rf', '--', directory], check=False,
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=120)
                  except subprocess.TimeoutExpired:
                      pass
          print(json.dumps({'free_bytes_before': before, 'free_bytes_after': shutil.disk_usage(workspace).free,
                            'sdk_cleanup_attempts': attempted}))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check cryptography==42.0.8
      - name: Check sealed experiment
        env:
          GH_TOKEN: ${{ github.token }}
          BOX_KEY: ${{ secrets.BOX_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: python -B mill.py probe --repo "$REPO" --tag "$TAG" --out out
      - name: Wake serial check
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python -B line.py --repo "$REPO" --tag l20261008b --out out --wake
